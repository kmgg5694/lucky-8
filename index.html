<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="행운역일진">
<meta name="theme-color" content="#1a8880">
<link rel="manifest" href="./manifest.json">
<title>행운역 일진</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap');


:root{
  --bg:#ffffff; --bg2:#c8e8e8; --bg3:#a8d8d8;
  --jade:#2aaea6; --jade2:#1a8880; --jade3:#106860;
  --gold:#D4AF37;
  --text:#102828; --dim:#507070; --border:#70b8b8; --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR','Noto Sans',sans-serif;
  max-width:480px;margin:0 auto;padding-bottom:80px;min-height:100vh;}

.hdr{background:linear-gradient(180deg,#eaf8f8 0%,var(--bg2) 100%);
  padding:20px 16px 14px;border-bottom:1px solid var(--border);}
.main-title{text-align:center;font-size:21px;font-weight:700;
  letter-spacing:5px;color:var(--jade2);
  text-shadow:0 0 24px rgba(78,205,196,.45);margin-bottom:4px;}
.sub-title{text-align:center;font-size:13px;color:var(--dim);letter-spacing:2px;}
.date-bar{text-align:center;font-size:14px;color:var(--text);font-weight:600;margin-top:6px;}

.guide{background:var(--bg2);margin:12px;padding:16px;
  border-radius:var(--r);border:1px solid var(--border);text-align:center;}
.guide-t{font-size:16px;color:var(--jade2);letter-spacing:2px;margin-bottom:8px;font-weight:700;}
.guide-txt{font-size:14px;color:var(--text);line-height:2.0;}
.tips{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
.tip{font-size:13px;color:var(--text);background:var(--bg3);
  padding:4px 12px;border-radius:20px;border:1px solid var(--border);}
.tip b{color:var(--jade);}

.btn-row{display:flex;flex-direction:row;gap:10px;margin:12px;justify-content:center;}
.hbtn{flex:1;max-width:none;height:76px;border:none;border-radius:var(--r);
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  transition:transform .12s;position:relative;overflow:hidden;}
.hbtn::after{content:'';position:absolute;inset:0;opacity:0;
  background:rgba(255,255,255,.1);transition:opacity .12s;}
.hbtn:active::after{opacity:1;}
.hbtn:active{transform:scale(.95);}
.hbtn .ico{font-size:24px;line-height:1;}
.hbtn .lbl{font-size:15px;letter-spacing:2px;font-weight:700;}
.btn-chun{background:linear-gradient(145deg,#0a1e48,#1248b0);
  color:#70b8ff;box-shadow:0 4px 16px rgba(18,72,176,.4);}
.btn-ji{background:linear-gradient(145deg,#0c2018,#186040);
  color:#60d898;box-shadow:0 4px 16px rgba(24,96,64,.4);}
.btn-in{background:linear-gradient(145deg,#1a0828,#581870);
  color:#c888f0;box-shadow:0 4px 16px rgba(88,24,112,.4);}
.btn-done{box-shadow:0 0 0 2px var(--jade2),0 4px 20px rgba(78,205,196,.5)!important;}

.ad-box{margin:0 12px 12px;background:var(--bg3);
  border:1px solid #1e3040;border-radius:var(--r);overflow:hidden;}
.ad-txt{text-align:center;padding:14px 18px 8px;font-size:14px;color:var(--text);}
.ad-num{text-align:center;font-size:26px;font-weight:700;color:var(--jade);padding-bottom:6px;}
.ad-bar-wrap{height:6px;background:#0d1828;margin:0 16px 14px;border-radius:3px;overflow:hidden;}
.ad-bar{height:100%;width:0%;border-radius:3px;
  background:linear-gradient(90deg,var(--jade),var(--jade2));transition:width linear;}
.qr-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
  z-index:110;align-items:center;justify-content:center;}
.qr-ov.on{display:flex;}
.qr-box{background:#f0fbfa;border:1px solid var(--jade);border-radius:16px;
  padding:24px 20px;width:260px;text-align:center;}
.qr-ttl{font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:14px;font-weight:bold;}
#qrCanvas{border-radius:8px;display:block;margin:0 auto;}
.qr-url{font-size:10px;color:var(--dim);word-break:break-all;
  margin:10px 0;line-height:1.5;max-height:36px;overflow:hidden;}
.qr-close{margin-top:14px;background:var(--gold);border:none;color:#1a0a00;
  padding:9px 28px;border-radius:8px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:1px;}

.result{margin:0 12px;}
.sec-hdr{display:flex;align-items:center;gap:8px;
  padding:10px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.sec-ico{font-size:16px;}
.sec-ttl{font-size:16px;color:var(--gold);letter-spacing:3px;font-weight:700;}

.card{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:18px;margin-bottom:12px;}
.c-head{display:flex;align-items:center;gap:14px;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.c-sym{font-size:48px;line-height:1;}
.c-info .c-no{font-size:13px;color:var(--dim);margin-bottom:3px;}
.c-info .c-name{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:2px;}
.fortune{font-size:15px;line-height:2.2;word-break:keep-all;}
.divider{text-align:center;color:var(--dim);font-size:12px;
  letter-spacing:2px;padding:12px 0;}

.share-box{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;margin-bottom:12px;}
.share-ttl{text-align:center;font-size:13px;color:var(--text);
  letter-spacing:1px;margin-bottom:10px;}
.share-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.sbtn{border:none;border-radius:8px;padding:12px 18px;font-size:14px;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;
  gap:5px;transition:transform .12s;}
.sbtn:active{transform:scale(.94);}
.s-kk{background:#FEE500;color:#3C1E1E;}
.s-fb{background:#1877f2;color:#fff;}
.s-cp{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.s-qr{background:var(--jade);color:#070a10;}
.s-ns{background:#2c2416;color:#f7e7c6;}

.reset-row{text-align:center;padding:4px 0 16px;}
.rbtn{background:#c04040;border:2px solid #902020;color:#fff;
  padding:14px 32px;border-radius:22px;font-size:15px;cursor:pointer;
  font-family:inherit;letter-spacing:3px;transition:all .2s;}
.rbtn:hover{background:#a03030;border-color:#701818;}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:100;align-items:center;justify-content:center;}
.ov.on{display:flex;}
.mbox{background:#f0fbfa;border:1px solid var(--jade);border-radius:16px;
  padding:26px 22px;max-width:300px;width:90%;text-align:center;}
.m-ttl{font-size:17px;color:var(--gold);letter-spacing:2px;margin-bottom:12px;font-weight:700;}
.m-body{font-size:15px;line-height:2.1;margin-bottom:22px;}
.m-row{display:flex;gap:10px;justify-content:center;}
.m-no{background:var(--bg3);border:1px solid var(--border);color:var(--dim);
  padding:10px 22px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;}
.m-yes{background:var(--jade);border:none;color:#070a10;
  padding:10px 22px;border-radius:8px;font-size:13px;
  font-weight:700;cursor:pointer;font-family:inherit;}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
  background:rgba(240,251,250,.97);border:1px solid var(--jade);color:var(--jade2);
  padding:10px 22px;border-radius:22px;font-size:13px;
  opacity:0;transition:opacity .28s;pointer-events:none;z-index:200;white-space:nowrap;}
.toast.on{opacity:1;}
.cat-grid{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.cat-item{display:flex;align-items:flex-start;gap:6px;margin-bottom:10px;font-size:15px;line-height:1.9;}
.cat-num{color:var(--gold);font-weight:700;min-width:26px;font-size:15px;flex-shrink:0;}
.cat-name{color:var(--gold);font-weight:700;min-width:52px;flex-shrink:0;font-size:15px;}
.cat-text{color:var(--text);font-size:14px;line-height:1.9;}
.fortune-full{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.full-title{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:1px;margin-bottom:8px;}
.footer{text-align:center;padding:16px;font-size:13px;color:var(--dim);line-height:2.0;}
.oro{color:var(--gold);font-weight:bold;}
.hidden{display:none!important;}


.lang-sw{display:flex;justify-content:center;gap:4px;padding:8px 0;background:var(--bg2);}
.lsw-btn{padding:4px 10px;font-size:11px;font-weight:700;border:1px solid #aaa;border-radius:4px;
  background:rgba(255,255,255,0.7);color:#555;cursor:pointer;font-family:inherit;}
.lsw-btn.active{background:rgba(255,255,255,0.95);color:#111;border-color:#555;}


/* ── ja 레이아웃 보호 (원칙3: CSS 먼저) ── */

body.lang-es .cat-name{font-size:13px;}
body.lang-es .cat-text{font-size:13px;}
body.lang-es .fortune{font-size:14px;line-height:2.0;}

.intro-sec{margin:12px;padding:14px 12px;background:var(--bg2);
  border:1px solid var(--border);border-radius:var(--r);text-align:center;}
.intro-ttl{font-size:14px;font-weight:700;color:var(--jade2);letter-spacing:2px;margin-bottom:10px;}
.intro-langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.intro-btn{padding:8px 10px;min-height:40px;font-size:12px;font-weight:700;
  border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);
  cursor:pointer;font-family:inherit;}
.intro-btn.on{background:var(--jade);color:#fff;border-color:var(--jade2);}
.intro-player{position:relative;margin-top:12px;border-radius:8px;overflow:hidden;background:#000;}
.intro-player video{width:100%;height:auto;display:block;vertical-align:top;}
.intro-player video::-webkit-media-controls-overlay-play-button,
.intro-player video::-webkit-media-controls-start-playback-button,
.intro-player video::-webkit-media-controls-play-button,
.intro-player video::-webkit-media-controls-mute-button,
.intro-player video::-webkit-media-controls-volume-control-container{
  display:none !important;opacity:0 !important;pointer-events:none !important;
}
.intro-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;}
.intro-media-btn{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:0;padding:0;
  background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;}
.intro-media-btn svg{width:32px;height:32px;fill:currentColor;display:block;}
.intro-media-btn .ic-sound{display:none;}
.intro-media-btn[data-muted="0"] .ic-muted{display:none;}
.intro-media-btn[data-muted="0"] .ic-sound{display:block;}
</style>
</head>
<body>
<div class="lang-sw">
  <button class="lsw-btn active" id="lswKo" onclick="setLang('ko')">한</button>
  <button class="lsw-btn" id="lswEn" onclick="setLang('en')">EN</button>
  <button class="lsw-btn" id="lswHi" onclick="setLang('hi')">हिंदी</button>
  <button class="lsw-btn" id="lswJa" onclick="setLang('ja')">日</button>
  <button class="lsw-btn" id="lswEs" onclick="setLang('es')">ES</button>
</div>

<div class="hdr">
  <div class="main-title" id="mainTitle"></div>
  <div class="sub-title" id="subtitle"></div>
  <div class="date-bar" id="dateBar"></div>
</div>

<div class="intro-sec">
  <div class="intro-ttl" id="introTtl">소개영상</div>
  <div class="intro-langs">
    <button type="button" class="intro-btn" data-lang="ko" onclick="playIntro('ko')">한국어</button>
    <button type="button" class="intro-btn" data-lang="en" onclick="playIntro('en')">English</button>
    <button type="button" class="intro-btn" data-lang="ja" onclick="playIntro('ja')">日本語</button>
    <button type="button" class="intro-btn" data-lang="es" onclick="playIntro('es')">Español</button>
    <button type="button" class="intro-btn" data-lang="hi" onclick="playIntro('hi')">हिन्दी</button>
  </div>
  <div class="intro-player" id="introPlayerWrap">
    <video id="introVideo" playsinline muted autoplay preload="auto"></video>
  </div>
</div>

<div class="guide">
  <div class="guide-t" id="guideTitle"></div>
  <div class="guide-txt" id="guideText"></div>
  <div class="tips"><span class="tip" id="tipText"></span><br><span class="tip" id="tipText2"></span></div>
</div>

<div class="btn-row">
  <button class="hbtn btn-chun" id="bC" onclick="press(0)"><span class="lbl" id="lblC"></span></button>
  <button class="hbtn btn-ji"   id="bJ" onclick="press(1)"><span class="lbl" id="lblJ"></span></button>
  <button class="hbtn btn-in"   id="bI" onclick="press(2)"><span class="lbl" id="lblI"></span></button>
</div>

<div class="ad-box hidden" id="adBox">
  <div class="ad-txt" id="adTxt"></div>
  <div class="ad-num hidden" id="adNum"></div>
  <div class="ad-bar-wrap hidden" id="adBarWrap"><div class="ad-bar" id="adBar"></div></div>
</div>

<div id="bonArea" class="hidden result">
  <div class="sec-hdr">
    <span class="sec-ico">☀️</span>
    <span class="sec-ttl" id="secBon"></span>
  </div>
  <div class="card" id="bonCard"></div>
</div>

<div id="byeonArea" class="hidden result">
  <div class="sec-hdr">
    <span class="sec-ico">🌙</span>
    <span class="sec-ttl" id="secByeon"></span>
  </div>
  <div class="card" id="byeonCard"></div>
  <div class="share-box">
    <div class="share-ttl" id="shareTtl"></div>
    <div class="share-row">
      <button class="sbtn s-kk" id="sBtnKK" onclick="shareKakao()"></button>
      <button class="sbtn s-fb" id="sBtnFB" onclick="shareFB()"></button>
      <button class="sbtn s-cp" id="sBtnCP" onclick="copyLink()"></button>
      <button class="sbtn s-qr" id="sBtnQR" onclick="showQR()"></button>
      <button class="sbtn s-ns" id="sBtnNS" onclick="shareNative()"></button>
    </div>
  </div>
  <div class="reset-row">
    <button class="rbtn" onclick="openModal()"><span id="resetBtnTxt"></span></button>
  </div>
</div>

<div class="footer" id="footer">© 김만기 이름연구소 · 행운역일진<br>본 운세는 참고용입니다</div>

<div class="qr-ov" id="qrOv">
  <div class="qr-box">
    <div class="qr-ttl" id="qrTtl"></div>
    <canvas id="qrCanvas" width="200" height="200"></canvas>
    <div class="qr-url" id="qrUrl"></div>
    <button class="qr-close" id="qrClose" onclick="closeQR()"></button>
  </div>
</div>

<div class="ov" id="modal">
  <div class="mbox">
    <div class="m-ttl" id="modalTtl"></div>
    <div class="m-body" id="modalBody"></div>
    <div class="m-row">
      <button class="m-no"  id="modalNo"  onclick="closeModal()"></button>
      <button class="m-yes" id="modalYes" onclick="doReset()"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

follows. Emotions run deep. Go too far and there is loss — but real estate fortune is at its finest. For women, something pleasing occurs. Pregnancy brings a girl. Substance is gained rather than fame. Do not step to the front. Promotion eludes you though the workload increases. Patience is the key to fortune — impatience causes even sure things to fail. Hospitalisation may become necessary. Leaders and those at the top will find much to be frustrated about. Matchmaking succeeds; personal courtship fails. Agree and succeed; oppose and regret follows. Following another's lead unconditionally brings good fortune. This is a time when mental strength is needed more than physical. Sending a representative in your place makes things happen. More study is called for. Finding a leader to follow would be wise.", "수뢰둔": "A season of challenge. Difficulties are many, yet there is real harvest at the end. Enemies and rivals are numerous — proceed with great care. In romance, the pain outweighs the pleasure; it is wiser to let go sooner rather than later. Travelling far brings accidents. Driving carries risk. Stock values fall sharply. Business profits become clearer. Pregnancy brings a son. In sports and competition, hardships continue. Defeat comes in court. Promotion does not materialise. Many misunderstandings may arise, but they are ultimately resolved. The pain will be compensated with certainty in the end. Loneliness deepens. No help comes from outside. Mental and material crisis looms. Illness is prolonged, but recovery does come. Battles begun by others bring victory; battles you yourself provoke end in failure. It is difficult, but press forward anyway. Protect yourself first before worrying about others. This is a tedious spring — yet summer is coming. Various incidents and accidents occur, so it will not be dull. Complacency is dangerous; small matters grow noisy. This is a time of turmoil. Adversaries appear on all sides. Ostracised by friends; business mired in a s  A defeatist mindset must be abandoned for things to succeed. A romantic partner will not appear. Misunderstanding arises between friends. Health is a serious concern. Contracts are not concluded. An urgent change of perspective is needed. A selfish mindset brings destruction. Reflect — and then reflect again. Stocks are completely ruined. Investment capital is entirely lost. This is not the time to act — it is the time to study and research. Do not rely on ability alone — cooperation is essential. Thrift is not a virtue at this time. The ambitions are petty. Abandon hollow and vain dreams. People must be continuously encountered. Staying only inside the home invites disaster. A serious accident occurs at the travel destination. For women, there is risk of sexual assault. Concealing the heart causes good fortune to flee. Competition and contests are both unfavourable. Examinations are failed. Business continues to shrink. The flow of funds is blocked and debts accumulate. Health is at its worst — death is a possibility. Human relationships are collapsing. Offering prayers or rites to heaven would be beneficial. Abandoning a selfish mindset causes things to break free. What is the point of gaining anything if people are lost? Property values continue to fall. Moving house brings some degree of relief. Do not try to win — seek compromise instead. Unjust gains cause even greater damage.", "수화기제": "Things keep going wrong one after another — constant problems without end. Perfectionism leads directly to ruin. Being too timid means good fortune never arrives. Much must simply be given up. Remember: you are not the only capable person in the world. Being difficult and demanding makes it impossible to sustain love. Stop overthinking — listen and accept what others say. Friends and those around you are all displeased. Become a person of substance rather than fuss. Works hard and still gets criticised for it. Taking on public duties and official responsibilities invites accidents. Large ventures absolutely cannot succeed. Do not make excuses when mistakes are made. Once something erupts, it cannot be brought back under control. Changing your mind frequently causes serious problems. Health always presents some issue. Ready results get ruined at the very last moment. Even when good fortune exists, it does not last. Stop talking about others — worry about yourself. Avoid formal wear and dress casually instead. An occasional drink may actually do some good. Appears to manage things well on the surface, but there are real problems underneath. Do not boast and do not interfere in others' affairs. Listen to your elders. Trust is not received in the workplace. Spreading efforts across two things causes both to fail. Do not only look for the good — be watchful for the bad. Decisiveness is essential. Do not become absorbed in unimportant matters. Do not even dream of large ventures.", "화수미제": "Fortune is gradually being brought under control. Reflection brings immediate benefit. The past must first be cleared before fortune can arrive. New people must be encountered. Romance causes quarrels and falls apart. A romantic partner has not yet arrived. Matchmaking is also unfavourable at this time. Waiting brings all things to resolution. Spending must be reduced. The faults of others are understood while one's own faults are accepted with grace. Hardship leads to good fortune. Correcting what is contradictory and wrong brings good fortune. Things cannot get any worse — carry a calm and peaceful mind. Even a mouse hole receives sunlight. Do not lose your energy. Much effort produces little, yet something worthwhile remains. The very start of the matter was wrong. Resolve each thing one at a time before moving on. A small adjustment in thinking causes everything to flow well. What others say is correct — accept it without condition. A serious misunderstanding is being held. Deception, theft and loss all occur. What leaks in the yard will leak in the kitchen too. Do not create new things — repair what is already broken. Opportunities will come frequently — hold energy to the very end. Strange and wayward thinking causes much damage. Do what is needed to at least hold the middle ground. Recurring misfortune must be blamed on oneself alone. Principles have been abandoned. The careless habit must be corrected. Do not wait for others to acknowledge you — acknowledge others first. Careful and thorough, yet mistakes remain frequent."};

function _getDATA_HI() {
  if (!_DATA_HI) {
    _DATA_HI = {"건위천": "जीवन-शक्ति अपने परम शिखर पर पहुँचती है — सभी कार्य महान सौभाग्य के साथ आगे बढ़ते हैं। परीक्षाओं में सफलता मिलती है; नौकरी के प्रयास सफल होते हैं। खेल, प्रतियोगिता और दाँव में विजय आपकी है। शेयर केवल अस्थायी रूप से ऊपर जाते हैं — अधिक समय तक न रखें। पुरुषों को प्रेम में सफलता मिलती है; स्त्रियों को हृदय का दुख हो सकता है। लंबी दूरी का सफर अभी उचित नहीं — दूसरों से टकराव की संभावना है। ऊर्जा इतनी प्रबल है कि संयम आवश्यक है। युवाओं की बीमारी पूरी तरह ठीक होती है। वृद्धों के लिए सावधानी ज़रूरी है। कार्य-क्षेत्र अपनी अधिकतम सीमा पर पहुँचता है — काम और अवसर बढ़ते हैं। स्त्रियाँ शारीरिक चोट से सतर्क रहें। बड़े उपक्रमों के लिए अत्यंत शुभ, छोटे कार्यों के लिए साधारण। धन का प्रवाह कठिन है किंतु आत्मिक और सृजनात्मक कार्यों के लिए यह काल सर्वोत्तम है। कार्य एक के बाद एक सुलझते जाते हैं — पर यह काल क्षणिक है। गलतफहमियाँ दूर होती हैं और सम्मान मिलता है। चुनाव और सार्वजनिक प्रतियोगिताओं के लिए सर्वश्रेष्ठ काल। प्रेम के नए अवसर आते हैं। वाहन और उपकरणों की खराबी से सावधान रहें। पदोन्नति का समय हो तो अवश्य होगी। आविष्कार, खोज और शैक्षणिक उपलब्धियों की प्रबल संभावना है। अधिकार और शक्ति बढ़ती है — न्यायिक मामलों में भी जीत मिलती है। लॉटरी आज़माएँ। जब आप शिखर पर हों तब सावधान रहें — नीचे जाने का मार्ग वहीं से शुरू होता है।", "곤위지": "शांति का आगमन होता है। स्त्रियों के लिए विशेष रूप से अनेक शुभ घटनाएँ आती हैं। धन और भौतिक समृद्धि बढ़ती है। मानसिक और बौद्धिक कार्यों में अवरोध आ सकता है। रोग लंबे समय तक चलता है। शेयर जल्दी बेच देना लाभकारी है। पुरुषों का प्रेम में विफलता; स्त्रियों के जीवन में पुरुष प्रकट होता है। प्रतियोगिता में पराजय होती है; पदोन्नति नहीं होती। मुकदमेबाजी और विवाद से बचें — जीत संभव नहीं। नया काम शुरू न करें किंतु पुराना कार्य लगातार चलता रहता है। व्यवसाय अपने स्तर पर बना रहता है, आगे नहीं बढ़ता। प्रतीक्षा करें और शुभ घटनाएँ स्वयं आएंगी — आगे बढ़ने पर असफलता मिलती है। भावनाओं में बह जाने का खतरा है। अति करने से हानि होती है किंतु अचल संपत्ति का भाग्य सर्वोत्तम है। स्त्रियों के लिए प्रसन्नता का अवसर आता है। गर्भावस्था में कन्या का जन्म होता है। सम्मान की बजाय वास्तविक लाभ मिलता है। नेतृत्व की स्थिति में न आएँ। पदोन्नति नहीं होती किंतु कार्यभार बढ़ता है। धैर्य ही सौभाग्य की कुंजी है — उतावलापन सुनिश्चित कार्यों को भी बर्बाद करता है। अस्पताल जाने की नौबत आ सकती है। जो शीर्ष पर हैं उनके लिए बहुत निराशाजनक समय है। बिचौलिए से विवाह सफल होता है; प्रेम-विवाह असफल। सहमत होने पर सफलता मिलती है; विरोध करने पर पछतावा होता है। दूसरों का अनुसरण करने से सौभाग्य आता है। यह समय शारीरिक बल से अधिक मानसिक शक्ति की माँग करता है। प्रतिनिधि को आगे करने से काम बनता है। अधिक अध्ययन आवश्यक है। नेता का साथ लेना बुद्धिमानी होगी।", "수뢰둔": "यह चुनौती का काल है। कठिनाइयाँ अनेक हैं फिर भी अंत में वास्तविक फल मिलता है। शत्रु और प्रतिद्वंद्वी अधिक हैं — अत्यंत सावधानी से चलें। प्रेम में कष्ट अधिक है; जितनी जल्दी हो सके छोड़ देना ही श्रेयस्कर है। दूर यात्रा में दुर्घटना हो सकती है। वाहन चलाना जोखिमभरा है। शेयर की कीमतें तेजी से गिरती हैं। व्यवसाय में लाभ स्पष्ट होने लगता है। गर्भावस्था में पुत्र का जन्म होता है। खेल और प्रतिस्पर्धाओं में कठिनाइयाँ जारी रहती हैं। न्यायिक मामलों में पराजय। पदोन्नति नहीं होती। अनेक गलतफहमियाँ उत्पन्न हो सकती हैं किंतु अंततः सुलझ जाती हैं। कठिनाई का निश्चित प्रतिफल बाद में मिलेगा। एकाकीपन बढ़ता है। बाहरी सहायता नहीं मिलती। मानसिक और भौतिक संकट है। रोग लंबा चलता है किंतु ठीक होता है। दूसरों के शुरू किए झगड़े में जीत मिलती है; खुद शुरू किए झगड़े में हार। कठिन है फिर भी आगे बढ़ते रहें। पहले खुद की रक्षा करें फिर दूसरों की सोचें। यह एक नीरस वसंत है — किंतु ग्रीष्म अवश्य आएगा। अनेक घटनाएँ और हादसे होते रहेंगे — बोर नहीं होंगे। लापरवाही खतरनाक है; छोटी-सी बात भी शोरगुल बन सकती है। यह उथल-पुथल का काल है। चारों दिशाओं से प्रतिद्वंद्वी उभरते हैं। मित्रों से अलगाव होता है; व्यवसाय मंदी में है। दूर जाने पर दुर्घटना का खतरा है।", "산수몽": "कठोर परिश्रम का कोई श्रेय नहीं मिलता। अकेलेपन में फँसने का खतरा है। मित्र दूर हो जाते हैं। व्यवसाय में थोड़ा सुधार होता है। समाधान के लिए लंबा इंतजार करना पड़ता है। सच्चाई दूसरों तक नहीं पहुँचती। प्रेम में असफलता; काम पूरा होता है किंतु लाभ कम। विश्राम अत्यंत आवश्यक है। दुर्घटना हो सकती है। इच्छाएँ कम करने पर थोड़ा लाभ होता है। हिचकिचाहट और निराधार चिंता बढ़ती है। व्यवसाय शुरू करने का यह समय नहीं। प्रतियोगिता में हार होती है — चुनौती न लें। विशेषज्ञ की सलाह आवश्यक है। प्रगति बिल्कुल नहीं हो रही। शेयर न खरीदें। स्वरोजगार में असफलता; नौकरी में स्थिरता। दूरदर्शिता से काम लेना होगा। धन का प्रवाह रुका हुआ है। बच्चों या अधीनस्थों को मार्गदर्शन देने पर शुभ परिणाम मिलते हैं। मोह के कारण हानि होती है। गलतफहमी का खतरा है — समझ का दायरा बढ़ाएँ। स्वास्थ्य धीरे-धीरे सुधरता है। कठिनाइयों को सुलझाने की कोशिश न करें — उनके गुजरने की प्रतीक्षा करें। हर काम छोटे पैमाने पर करने का समय है। दूसरों के मामलों में हस्तक्षेप नुकसानदेह है। खरीदारी में सावधानी आवश्यक है। विदेश न जाएँ। संसार बदलता रहता है — निराश न हों। पहले कदम में ही समस्या है — जल्दबाजी न करें।", "수천수": "भाग्य आगे बढ़ता है यद्यपि मार्ग में छोटी-छोटी बाधाएँ हैं। प्रतीक्षा करें और सब सुलझ जाएगा — बिना प्रयास के भी समाधान मिलता है। शेयर में सुधार हो रहा है — बेचने का समय नहीं। अपनी गति को नियंत्रित करें। कुशल लोग भी कभी-कभी चूक जाते हैं — दूसरों को कमतर न समझें। पीछे हटने पर हानि होती है; केवल थोड़ी चतुराई की आवश्यकता है। पास में ही शत्रु हैं। न्यायिक कार्यवाही लंबी खिंचती है। पुरुषों को अधिक लाभ; स्त्रियों को अधिक हानि इस समय। नौकरी और व्यवसाय में परिवर्तन आता है। पति-पत्नी, प्रेमी और मित्रों से विवाद होता है। स्वास्थ्य में सर्दी, सिरदर्द और मामूली बीमारियाँ संभव हैं। प्रतीक्षित कार्यों में देरी होती है। प्रेम में पुरुषों को बाधाओं के बाद सफलता मिलती है। स्त्रियों को प्रेम में असफलता और अविश्वसनीय व्यक्ति से मिलने का खतरा। साझेदारी न करें; उधार दिया धन वापस नहीं आता। अचानक बुरी घटना आती है किंतु सुलझ जाती है। अचल संपत्ति न खरीदें। नजदीक से लाभ और दूर से हानि होती है। पिकनिक और आयोजनों में बाधा आती है। समय-सीमा आगे बढ़ाने पर लाभ होता है।", "천수송": "गलतफहमियाँ दूर होती हैं। विवाद होता है किंतु सक्रिय रूप से आगे बढ़ने पर जीत मिलती है। वर्तमान में कष्ट है किंतु शीघ्र ही अच्छे दिन आने वाले हैं। रहस्य उजागर होने का गंभीर खतरा है — अत्यंत सावधान रहें। सट्टेबाजी के उपक्रम उचित नहीं। शेयर तेजी से ऊपर जाते हैं। एक लंबित समस्या अंततः सुलझती है। सम्मान मिलेगा। प्रेम में पुरुषों को सफलता मिलती है। स्त्रियों के मामले में पुरुष पीछे हट जाता है। अनुचित लाभ शीघ्र ही बड़ी हानि में बदल जाता है। चिंताएँ गायब होती हैं। रोग पूरी तरह ठीक होता है। जितना दूर यात्रा करें उतना अच्छा। प्रतियोगिता, परीक्षा और न्यायिक मामलों में जीत मिलती है। अपराध उजागर होते हैं और परिणाम भुगतना पड़ता है। लकी ड्रॉ और लॉटरी में कुछ भाग्य है किंतु जुए में हानि। बिना उचित कारण के कार्य पूरा नहीं होता। हठ और जिद हानिकारक है। अचानक बदलाव के संकेत दिखते हैं। पहले आँसू फिर हँसी। सफलता निश्चित है — आत्मविश्वास बनाए रखें। अचानक मामले सुलझने लगते हैं।", "지수사": "धन संचित होता है। जो खो गया था वह वापस मिलता है। प्रेम संबंध गहरा और शारीरिक रूप में बदलता है। एक रहस्य जन्म लेता है और अच्छी तरह बना रहता है। व्यवसाय की नींव मजबूत होती है। बड़ी सभाओं में जाना होता है या लोग आकर्षित होते हैं। ख्याति और सम्मान की उम्मीद न रखें। छिपे हुए और आंतरिक कार्यों में सफलता; सार्वजनिक कार्यों में मंदगति। शेयर जितने लंबे समय रखें उतना लाभ। अपने पास ही ध्यान दें — उत्तर नजदीक है। बड़े विवाद का खतरा है। सामान्य और रोजमर्रा के काम बिना किसी बाधा के होते हैं। व्यक्तिगत कार्य सफल होते हैं; सार्वजनिक कार्य नहीं। प्रेम हो सकता है किंतु विवाह सरल नहीं। यात्रा की आवश्यकता नहीं — घर पर रहने में सुख है। बिना खर्च के आनंद मिल सकता है। स्वास्थ्य में जोश और ऊर्जा है। आंतरिक बीमारियाँ हो सकती हैं। गर्भावस्था में पुत्र की संभावना। उत्पादन और विनिर्माण में बड़ी सफलता। स्त्रियों को वह मिलता है जिससे वे प्रेम करती हैं; पुरुषों को वह मिलता है जो उनसे प्रेम करता है। रूप से अधिक सार महत्वपूर्ण है। मौन सुख का आगमन होता है। माँ और पुत्र दोनों अच्छे से आगे बढ़ते हैं। प्रतियोगिता में हार होती है। नए काम नहीं चलते; पुराने काम धीरे-धीरे बढ़ते रहते हैं। विवाह होने पर संतान अधिक होती है। व्यवसाय करने वालों के कर्मचारी बढ़ते हैं।", "수지비": "जो कमी थी वह ठीक समय पर पूरी होती है। सर्वोत्तम प्रेम का आगमन होता है। घर में शांति रहती है। आंतरिक शक्ति चुपचाप संचित होती है। महान नहीं किंतु गहरी संतुष्टि मिलती है। जो चला गया था वह वापस आने की अच्छी संभावना है। अचानक मित्रों की संख्या बढ़ जाती है। कार्यस्थल पर और मित्रों में पहचान और सराहना मिलती है। विश्राम का सुखद अवसर मिलता है। विक्रेताओं के अनुबंध अच्छी तरह होते हैं। अचल संपत्ति से अच्छा लाभ मिलता है। शेयर में बड़ा लाभ नहीं किंतु हानि भी नहीं। छोटे-छोटे कार्य लगातार सुलझते जाते हैं। स्थिरता और शांति बनी रह सकती है। लक्ष्य तक पहुँचा जाता है। मनोरंजन उद्योग में असफलता। खेलने-घूमने के लिए अच्छा; काम के लिए कमजोर। आवश्यक वस्तुओं के व्यवसाय में सफलता; अन्य व्यवसाय कमजोर। लॉटरी और पुरस्कारों में थोड़ा लाभ। सट्टेबाजी में बर्बादी। सुलह बहुत अच्छी तरह होती है। परीक्षाओं और प्रतियोगिताओं में हार होती है। अपनी योजनाओं का पैमाना छोटा करें। योजना बनाने की बजाय प्रकृति पर छोड़ दें। गतिविधि में कमी है — इसे पूरा करें। निम्न स्तर के पदों पर काम करने वाले अच्छा प्रदर्शन करते हैं।", "풍천소축": "जीवन बहुत आनंददायक हो जाता है। खर्च बढ़ जाता है। खर्च करने के अवसर और धन दोनों आते हैं। प्रेम एक समय के लिए अत्यंत आनंददायक होता है — फिर बिछड़ जाता है। हर चीज प्रचुरता से उमड़ पड़ती है। चिंताएँ गायब होती हैं। अनुबंध रद्द होने की संभावना अधिक है। विक्रेताओं के लिए सबसे बुरा समय। विलासिता की वस्तुएँ अच्छी बिकती हैं। यात्रा गंतव्य पर सुखद घटनाएँ होती हैं। तनाव पूरी तरह दूर होता है। मनोरंजन उद्योग फलता-फूलता है। अचल संपत्ति में नुकसान। जुए में सबसे बुरी हार। रहस्य उजागर हो जाते हैं। शेयर जो जल्दी न बेचें वे पूरी तरह बर्बाद हो जाते हैं। त्वरित निर्णय से सफलता; दीर्घकालीन खेल में हार। कुछ भी संचित नहीं होता — जो है उसे मजबूती से थामे रखें। विवाह और प्रेम दोनों टूट जाते हैं। हर चीज में भारी उतार-चढ़ाव है। लापरवाही और ढिलाई से बड़ी हानि हो सकती है। दूसरों के प्रति उदारता करने पर वापस आता है। प्रसिद्धि है किंतु सम्मान नहीं। चोरी और धोखाधड़ी का खतरा अत्यधिक है। मुकदमे और विवाद में बिना शर्त हार होती है। बाधाएँ आसानी से और जल्दी सुलझ जाती हैं।", "천택리": "आप स्वर्ग का आशीर्वाद प्राप्त कर रहे हैं। लॉटरी खरीदना लाभदायक हो सकता है — परिणाम आ रहे हैं और लाभ है। प्रगति तेजी से होती है। शेयर में बड़ी वृद्धि होती है। स्थानांतरण का अवसर है। पदोन्नति होगी। विदेश में प्रतिनियुक्ति और व्यापार यात्राएँ होती हैं। एक अच्छे पुरुष से मिलकर खूब प्रेम और से बढ़ता है। संपत्ति लगातार बढ़ती है। पूँजी पर्याप्त हो जाती है। पुरुष और स्त्री दोनों को सुखी प्रेम मिलता है। पैसों की चिंता दूर होती है। स्वास्थ्य दिन-दिन बेहतर होता है। विलय, अधिग्रहण और विस्तार संभव है। सम्मान की बजाय वास्तविक लाभ मिलता है। कला संग्रह करने पर लाभ होता है। कार्यस्थल पर वेतन बढ़ता है या आरामदायक पद मिलता है। वरिष्ठों का विश्वास मजबूत होता है। वजन नियंत्रित होकर सुंदरता आती है। एकता बहुत अच्छी होती है। विभिन्न प्रकार के व्यवसाय सभी अच्छे चलते हैं। किसी प्रियजन के गुजर जाने का खतरा है। संतोषजनक घटनाएँ होती हैं। चुनौतियों का कोई असर नहीं होता। परीक्षाएँ पास होती हैं और अच्छे स्कूल में प्रवेश मिलता है। थकान और क्रोध जल्दी दूर होते हैं। सहयोगी बढ़ते हैं और एकाकीपन दूर होता है। बैठे-बैठे लाभ मिलता है। अधिकार और शक्ति बढ़ती है। नए सदस्यों और नियमित ग्राहकों की बड़ी संख्या आकर्षित होती है।", "산지박": "संगठन का नेता बनते हैं। स्थिति नाजुक है किंतु अंत में जीवित बच जाते हैं। जिम्मेदारी का बोझ भारी हो जाता है। बच्चे और अधीनस्थ बात नहीं मानते। नेटवर्क मार्केटिंग में बड़ी सफलता। अंत तक टिके रहने पर सार्थकता मिलती है। आंतरिक समस्याओं से सिरदर्द होता है। बड़ी वस्तुएँ बेचने के व्यवसाय में सफलता। बड़ी भीड़ इकट्ठा की जा सकती है। बीमारी गंभीर है किंतु धैर्य से ठीक होती है। हर काम धीमा है। स्थिरता है किंतु विकास सीमित है। सम्मान मिलता है किंतु खुशी नहीं। जीवन तंगी से भरा है। धन का प्रवाह ठीक से नहीं होता। नए व्यवसाय असफल होते हैं। पास में लोग हैं किंतु मदद सीमित है। भाग्य इतना दृढ़ है कि टूटता नहीं। समस्याएँ हमेशा नीचे से आती हैं। स्त्री का साथ न देने से प्रेम कष्टदायक है। न्यायिक मामलों में हार होती है। ऊँचा पद मिलता है किंतु केवल मेहनत ही हाथ लगती है। परिवर्तन बहुत कम होता है। टिके रहने पर लाभ; आगे बढ़ने पर हानि। निवेश करने पर पैसा फँस जाता है। तेजी से चलने पर बिना शर्त असफलता।", "지뢰복": "अभी समय नहीं आया। पुरानी बीमारी में आशा की किरण दिखने लगी है। एक पलटाव होता है। प्रेम में हल्के-हल्के संकेत दिखाई देते हैं। शेयर काफी लंबे इंतजार के बाद ठीक होते हैं। दिशा अच्छी तरफ मुड़ चुकी है। लड़ाई और प्रतियोगिता में पिछड़ना होता है। दीर्घकालिक योजनाओं ने रास्ता पकड़ लिया है। केवल छोटी राशि का ही प्रबंध हो सकता है। व्यवसाय को स्थगित करें किंतु छोड़ें नहीं। मेहनत करने पर निश्चित रूप से फल मिलेगा। जल्दबाजी निश्चित कार्यों को भी बर्बाद करती है। यात्रा तो दूर — घर से बाहर निकलना भी सँभालकर करें। गर्भावस्था का खतरा है। बीज बोए जा चुके हैं किंतु अनेक बाधाएँ हैं। आकाश मदद करेगा — विनम्र रहें। खुद से बढ़ रहा है — करने को कुछ नहीं। अभी क्रिया महत्वपूर्ण नहीं है। रास्ता दिखे तो भी रुकना होगा। दूर से खबर आ सकती है। निष्क्रिय रहने पर लाभ; सक्रिय रहने पर बर्बादी। विश्राम करते हुए दूर देखना होगा। अलगाव और एकाकीपन महसूस होता है। सर्दी गहरी है — बसंत आएगा। आलसी रहना ही फायदेमंद है। छोटा छोड़ने पर बड़ा मिलता है। क्रिया से अधिक अंतरात्मा की आवाज महत्वपूर्ण है। योजनाएँ पहले से बना लेनी होंगी।", "천뢰무망": "अप्रत्याशित लाभ मिल सकता है। शेयर अपने अधिकतम स्तर पर पहुँच जाते हैं। कुछ चौंकाने वाला होता है। एक पूर्ण लगने वाले काम के बिगड़ने का खतरा — अत्यंत सावधान रहना आवश्यक है। एक बड़ी जिम्मेदारी मिलती है। स्त्रियों के जीवन में एक प्रशंसनीय पुरुष प्रकट होता है। इंतजार करने पर वह पुरुष खुद करीब आता है। छोटी बात बड़ी हो जाती है। एक विशाल मंच पर काम करने का अवसर मिलता है। बड़ी ख्याति पाने के संकेत हैं। किसी वरिष्ठ की सहायता से एकाएक सफलता मिल सकती है। दुर्घटनाओं और आपदाओं से सावधान रहना होगा। जो बिल्कुल रुका हुआ था वह अचानक खुल जाता है। शल्य चिकित्सा या चोट का खतरा — स्त्रियों को विशेष सावधानी। संगठन में असली ताकत बन जाते हैं। अत्यधिक तीखापन हमले को आमंत्रित करता है। मन को गहरी ठेस लग सकती है। अचानक दूर भेजा जा सकता है। किसी प्रियजन के चले जाने की चिंता है। भविष्य की संभावनाएँ बढ़ती जा रही हैं। प्रतियोगिता में बड़ी जीत का इंतजार है। बहुत जोर से बोलने पर गलतफहमी होती है। पीछे रहने का खतरा है — सतर्क रहें। आकाश साथ है।", "산천대축": "बड़ी संपत्ति जमा होगी। धन का प्रवाह पर्याप्त है। शेयर बेचें नहीं — बनाए रखें। जल्दबाजी से चोट लगती है। पिछले कार्यों की समीक्षा करनी होगी और मजबूत समापन करना होगा। कमाने की बजाय हानि न हो इस पर ध्यान दें। नया व्यवसाय संभव नहीं। स्त्रियों को एक योग्य पुरुष मिलता है और भरपूर प्रेम मिलता है। सट्टा और मनोरंजन उद्योग में असफलता। प्रकाशन और लेखन में बड़ी सफलता। स्वास्थ्य अत्यंत अच्छा हो जाता है। जितना संयमित व्यवहार उतना अधिक सम्मान मिलता है। यात्रा पर जाने से हमेशा नुकसान होता है। स्थानांतरण अवश्य स्थगित करना होगा। साझा उपक्रमों में बड़ी सफलता। बहुत से लोग पास आते हैं। घर पर समय बढ़ाना लाभदायक है। आगे बढ़ना थोड़ा रुक सकता है किंतु अंत में रास्ता खुलता है। पुरुषों के मामले में एकतरफा प्रेम की संभावना अधिक है। सट्टेबाजी न करने वाले व्यवसाय जितने बड़े हों उतने अच्छे। आलस्य ही दवा है। सहयोगी इकट्ठा होते हैं किंतु प्रेम सीमित है।", "산뢰이": "पूरी सुरक्षा मिलती है। लंबे समय तक बिना किसी परेशानी के वृद्धि होती रहती है। जो पर्वत पर चढ़ नहीं सकते — उसे चढ़ने का प्रयास छोड़ दें। बच्चे अच्छे जा रहे हैं। नींव मजबूती से डाली जा रही है। शेयर से लाभ के लिए बहुत लंबा इंतजार — जल्दी छोड़ देना ही बेहतर। किसी बड़ी कंपनी का अनुबंध हो जाता है। विशाल संसार में जाने का समय अभी दूर है। बीमारी बहुत धीमी गति से ठीक होती है। केवल छोटी राशि ही जुटाई जा सकती है। रक्षा पर पूरी तरह ध्यान केंद्रित करना होगा। जितना देर से जाएँ उतने अवसर मिलते हैं। प्रतियोगिता में शक्ति कमजोर पड़ती है। घर खरीदने पर कीमत लगातार बढ़ती है। एकाकीपन है किंतु दूर कोई मित्र है। विवाह होता है। प्रेम संकट का सामना करता है। मौन स्वर्ण है। प्रयास करके आगे आने पर कोई पहचानता नहीं। कार्यस्थल पर कोई समस्या नहीं। काम में देरी होती है — योजनाएँ बनाएँ ही नहीं। परीक्षार्थी और शोध छात्र सही दिशा में जा रहे हैं। कोई नई घटना नहीं होती — ऊब सकते हैं। आगे एक विशाल बाधा खड़ी है।", "택풍대과": "घटना और दुर्घटना सामने खड़ी हैं। तुरंत सँभालने का उपाय सोचें। लालच बहुत बढ़ गई है। वर्तमान स्थिति को बनाए रखना बहुत कठिन है। एक अत्यंत उग्र और भावुक प्रेम होने वाला है। पके काम में भी राख पड़ सकती है। अपनी क्षमता पर घमंड न करें। निवेश में बिना शर्त हानि होती है। नया व्यवसाय नहीं शुरू करना चाहिए। लंबे विश्राम के बाद ही संकट टलता है। स्वास्थ्य अत्यंत खतरनाक स्थिति में है। शल्य चिकित्सा या मृत्यु भी संभव — तुरंत उपाय करें। लड़ाई शुरू करने पर बड़ी दुर्घटना होती है। बच्चे और अधीनस्थ मुसीबत पैदा करते हैं। काम बढ़ाने की बजाय घटाने की सोचें। भविष्य अच्छा लगता है किंतु यह भ्रम है। पास में बहुत ज्यादा लोग सलाह दे रहे हैं। छोड़ दें और असली क्षमता बनाएँ। यात्रा न करें किंतु घर से बाहर खूब निकलें। नाव के पलटने का खतरा — पानी से सावधान। शराब पीकर दुर्घटना करने का खतरा बहुत अधिक है। अपनी हैसियत पहचानें। उत्तेजित मन को तुरंत शांत न किया तो भारी हानि। बिना किसी शर्त के माफी माँगें। एक बार टूट गया तो सँभालना कठिन — अत्यंत सावधानी। केवल विनम्रता औरसमझौता ही जीने का रास्ता है। जो अच्छा चल रहा था वह अचानक टूट सकता है। अंदर एक खतरनाक बीज पल रहा है — ध्यान से देखें।", "감위수": "प्रेम में गहराई से डूब जाते हैं। जेब-खर्च और आय आरामदायक हो जाती है। लोगों के साथ घुलने-मिलने के कई अवसर मिलते हैं। दिशा खो गई है। कोई मार्गदर्शक नेता नहीं है। दुःख में डूबने का खतरा है। अत्यधिक शारीरिक प्रेम से विवेक खो सकता है। भावनाओं को नियंत्रित रखना आवश्यक है। शराब पीकर बड़ी गलती करने का खतरा है। पानी में डूबने का भी खतरा — सावधान रहें। साझेदारी बिना शर्त अच्छी है। व्यवस्था टूट रही है। परेशानियाँ बढ़ती हैं। हर बात दूसरों से पूछनी होगी। रास्ता खो जाता है और भटकाव होता है। लड़ाई में हार होती है। शेयर रखे रहने पर नुकसान नहीं होता। शराब, खानपान और किराने के व्यवसाय में बड़ी सफलता। बीमारी लंबे समय तक चलती है। विविध छोटी-छोटी घटनाएँ परेशानी बढ़ाती हैं। संतुलन खो जाता है। लोग अधिक दिखते हैं किंतु गहरा अकेलापन है। सोच बहुत कच्ची है। शारीरिक शक्ति का क्षरण अधिक होता है। काम और अवसर पर्याप्त मिलते हैं। वरिष्ठों से बार-बार मिलने पर सौभाग्य आता है। दृष्टि सीमित है। प्रेम सुखद है; मित्रता टूट रही है। परीक्षाओं में असफलता। सौदेबाजी असफल होती है। रहस्य बना रहता है।", "이위화": "मन उज्ज्वल होता है। कोई शुभ घटना होती है। सम्मान और प्रतिष्ठा बढ़ती है। मनोरंजन और प्रदर्शन उद्योग में बड़ी सफलता। स्त्रियाँ लोकप्रिय होती हैं। पुरुषों को प्रेमी मिलता है। गहरे अर्थ वाला मित्र मिलता है। शेयर में असली लाभ नहीं है। यात्रा सुखद होती है। अच्छे परिणाम की उम्मीद है। आशा दिखाई देती है। अच्छी नौकरी और पदोन्नति की संभावना है। गलतफहमियाँ दूर होती हैं। जहाँ भी जाएँ स्वागत होता है। विचारों की बाढ़ आती है। धन का प्रवाह नहीं किंतु व्यवसाय बना रहता है। चिंताएँ गायब होती हैं। इतने मित्र हैं कि व्यवसाय की चिंता नहीं। आय बहुत अधिक नहीं किंतु स्थिरता बनी ा बड़ा उद्यम उतनी अधिक सफलता; छोटे में कम फायदा। दूसरों के साथ प्रतियोगिता मेंआत्मविश्वास के साथ जीत। हवाई जहाज से दूर जाने का भाग्य है। घर पर बैठे रहने पर नुकसान होता है। अधीनस्थ बढ़ते हैं। ऊँचे पद पर पदोन्नति की प्रबल संभावना है। सौदेबाजी में बड़ी इच्छाएँ रखें। लॉटरी पर बड़ी उम्मीद रखना उचित है। सड़क पर लड़ाई-झगड़े से सावधान रहें। बीमारी बिना शर्त ठीक होती है। स्वास्थ्य इतना अच्छा है कि परेशानी हो जाती है। कठिन काम पूरा होगा। छोटी बातें छूट रही हैं। बहुत बोलने से दुश्मन बनते हैं। पर्वतारोहण खतरनाक है। किसी बड़े आयोजन में भाग लेना होगा।", "화지진": "लंबे वर्षों के बाद परिणाम सामने आने लगे हैं। आगे का रास्ता सुचारु है। स्त्रियों के जीवन में सर्वोच्च खुशी का पल आएगा। मंदा पड़ा व्यवसाय फिर से जल जाता है। अब पूरी गति से दौड़ने का समय है। एक विशाल मंच की ओर बढ़ना होगा। व्यवसाय धीरे-धीरे और निश्चित रूप से बेहतर होगा। स्त्रियाँ अच्छी जगह शादी करती हैं। उदासी दूर होती है और उत्साह बढ़ता है। अभी शेयर में भारी निवेश का समय है। जमीन की कीमतें बहुत बढ़ती हैं। अप्रत्याशित सौभाग्य पर मुस्कान आएगी। अभी लॉटरी खरीदें। सोचना बंद करें और कार्रवाई में उतरें। स्वास्थ्य तेजी से बेहतर होता है। निर्यात व्यवसाय में बड़ा धमाका। कठिन पल में भाग्यशाली व्यक्ति मिलकर मदद करता है। पुरुषों को प्रेम में मजा नहीं। सामाजिक दर्जा ऊँचा होगा। आगे मत बढ़ें — पीछे चलें। सबसे छोटी चीज भी अच्छी लगती है। अधिक उदार नजरिए की जरूरत है। अच्छा समय मिला है — चिंताओं को दूर रखें। बुरे मित्रों को तुरंत दूर करना होगा। अतीत जल्दी भुलाकर आगे बढ़ना होगा। घरेलू उद्योग में बड़ी सफलता। छोटी वस्तुएँ अच्छी बिकती हैं। बड़ा पैसा अभी नहीं आया किंतु तंगी से मुक्ति मिलेगी।", "지화명이": "समय बहुत प्रतिकूल है। स्त्रियाँ प्रेम में असफल होकर रोती हैं। प्रतियोगिता में असफलता निश्चित है — आगे बिल्कुल मत आएँ। स्वास्थ्य खतरे में है — अस्पताल में विस्तृत जाँच आवश्यक है। शेयर में बड़ा नुकसान होगा — अभी जो बचे उसे बचाना बेहतर है। घर से बाहर निकलने पर बिना शर्त नुकसान। बड़ी गलतफहमी होगी — कोई भी कदम न उठाएँ। अभी से और बुरे होने की तैयारी करनी होगी। चोरी और चीजों के खोने का खतरा है। बीज बोए हैं किंतु अंकुर नहीं फूटते। उत्सुक मन बड़ी दुर्घटना बुलाता है। पदोन्नति नहीं होगी — वर्तमान पद ही बचाना होगा। जैसी उम्मीद थी वैसा नहीं होता। अकेले में आँसू बह सकते हैं। सभी निर्णय और फैसले टाल दें। थोड़े समय के लिए छुप जाना बेहतर होगा। पूँजी फँसने का खतरा है — निवेश से बचें। मित्रों की कोई सहायता नहीं। अचानक रास्ता खो सकते हैं। खाद्य विषाक्तता और पाचन विकारों से सावधान। सोचा था उससे ज्यादा उलझनें होती हैं। सुलझाने की कोशिश करने से और उलझता है। समय ही दवा है। सुबह जरूर आएगी — धैर्य रखें।", "풍화가인": "नौकरी की परीक्षाएँ पास होती हैं। घर में सद्भाव रहता है। कोई समूह बनता है या मित्र बहुत बढ़ते हैं। प्रेम अच्छी तरह आगे बढ़ता है। बातचीत अनुकूल रूप से समाप्त होती है। आपूर्ति और डिलीवरी अच्छी तरह होती है। साझेदारी सफल होती है। मित्रों के साथ मिलने-जुलने के दिन बढ़ते हैं। शेयर में नुकसान नहीं होता। ग्राहक आते हैं या संपर्क बार-बार होता है। स्वास्थ्य बिना किसी चिंता के ठीक रहता है। अकेलापन दूर होता है। व्यक्तिगत कार्यों में नुकसान होता है किंतु सामूहिक कार्यों में लाभ। कार्यस्थल पर पद मजबूत होता है। आकर्षण धीरे-धीरे बढ़ता है। पहला प्यार या पुराना मित्र मिल सकता है। कंपनी बनाने पर सफलता मिलती है। जटिल बातें सरल होती जाती हैं। विचारों की बाढ़ आती है। जोड़े के रूप में या समूह में यात्रा करने पर सौभाग्य आता है। विकास की गति धीमी किंतु सुरक्षित है। स्कूल में आसानी से प्रवेश मिलता है। पुरानी योजनाएँ एक-एक करके पूरी होती हैं। लड़ाई में नुकसान होता है या हार जाते हैं। नया अनुबंध होता है। जमा किए हुए धन से अच्छा भाग्य बनता है। सब कुछ लगातार और स्थिर है। जितने ज्यादा लोगों से मिलें उतना भाग्य सुधरता है। स्थिरता आती है किंतु कोई बड़ा बदलाव नहीं। सावधानी कुछ ज्यादा ही है। परिवर्तन कम है।", "화택규": "अपने मूल स्थान को छोड़कर प्रवास या विदेश जाना संभव है। लंबे समय तक सहने के बाद एक साहसिक कदम उठाते हैं। अचानक स्टार बन जाते हैं। कार्यस्थल पर दूसरों से आगे निकलते हैं। चिंताएँ एक साथ गायब होती हैं। यात्रा का अवसर आता है। स्त्रियों के मामले में एक मित्रता टूटती है। प्रेमी के साथ विचारों का तालमेल आवश्यक है। व्यवसाय अचानक चल पड़ता है। शेयर में बड़े लाभ की संभावना है। लॉटरी पर उम्मीद रखना उचित है। मंच बड़ा होता है। लोकप्रियता तेजी से बढ़ती है। धन का प्रवाह अचानक होता है। प्रसिद्धि और ख्याति बढ़ती है। घर छोड़कर स्वतंत्र होने का भाग्य है। बेहतर नौकरी की तरफ जाने की संभावना है। निर्यात अच्छा रहेगा। सामान पंख लगाकर बिकता है। स्त्रियों का विवाह होता है। मनोरंजन और फैशन व्यवसाय में बड़ी सफलता। भाग्य अच्छी दिशा में धकेल रहा है। कुछ मिठास-कड़वाहट मिली घटना होती है। पैसा खर्च करना होगा। एक समय के लिए अकेलापन आता है किंतु मूड अच्छा रहता है। बीमारी अचानक ठीक होती है। रिश्तेदारों या परिवार में किसी के चले जाने का खतरा। एक नया व्यावसायिक उद्यम शुरू होता है। अंत में पूर्णता प्राप्त होती है।", "수산건": "अंधेरे में फँसे हैं — हिल नहीं सकते। चरम जिद से पूरी तरह बर्बादी होती है। मामले बुरी तरह उलझ जाते हैं। प्रेम में शारीरिक संबंध है। पैसों का रास्ता पूरी तरह बंद है। एक मित्रता टूट जाती है। व्यवसाय में लगातार नुकसान होता है। गिरफ्तारी और हिरासत जैसी मुसीबत हो सकती है। स्वास्थ्य अपनी सबसे बुरी स्थिति में है। यदि पहले से बीमारी थी तो गंभीर शारीरिक क्षति का खतरा। बुरी बातें एक के बाद एक आती रहती हैं। आगे बढ़ना असंभव है। यात्रा स्थल पर दुर्घटना होती है। गाड़ी चलाने में भी सावधानी आवश्यक है। मित्रों से संबंध टूटते हैं। रिश्तेदारों से शत्रुता मिलती है। प्रतिबिंब और माफी ही स्थिति को सुधार सकती है। सभी प्रतियोगिताओं में पराजय होती है। घर में परेशानी हो सकती है। किसी विशेषज्ञ से परामर्श लें। तरीका ही शुरू से गलत है। लोगों को कमतर समझने पर आपदा आती है। एक ही काम दोहराने पर स्थिति और बिगड़ती है। परिवार से नहीं — दूर के किसी व्यक्ति से सलाह लें। साझेदारी या व्यक्तिगत व्यवसाय — कोई भी उपयुक्त नहीं। शेयर बर्बाद होते हैं। कर्ज बढ़ता जाता है। पैर और कमर में चोट लगने का खतरा है। अत्यधिक व्यक्तिगत होने से भाग्य बिगड़ता है।", "뇌수해": "एक मामला सुलझता है। व्यवसाय को थोड़ा रास्ता मिलता है। एक पुरुष प्रेमी चला जाता है। कार्यस्थल के अंदर विभाग बदलता है। शेयर में कम से कम मूलधन तो वापस मिल सकता है। अंधेरा छँट रहा है — आशा बनाए रखें। मोह छोड़ने पर और अच्छी बात होती है। हृदय पर चोट लगी है। अस्थायी रूप से अकेलापन है किंतु पहचान मिलती है। गर्भवती माँ बिना किसी जटिलता के पुत्र को जन्म देती है। दाँत टूट सकता है। जल्दी करने की जरूरत नहीं। थोड़ी राशि का प्रबंध होता है। जाने पर लाभ; रहने पर नुकसान। अकेले किए काम में सफलता। एक मजबूत नया अंकुर फूट रहा है। सामाजिक दर्जा थोड़ा बढ़ता है। मेहनत के अनुपात में परिणाम मिलता है। गलतफहमियाँ पूरी तरह दूर होती हैं। किसी रिश्तेदार से अलगाव हो सकता है किंतु पश्चाताप नहीं। सामान्य दिनचर्या से दूर जा सकते हैं। अतीत अँधेरा था किंतु भविष्य वैसा नहीं होगा। पीछे मत देखें — सीधे आगे बढ़ें। एक नई खोज से रास्ता खुलता है। सार्वजनिक और व्यक्तिगत यात्राएँ होती हैं। किसी संगठन के टूटने की संभावना है। परिवार में कलह होगी। वादे पूरे नहीं होंगे। आपराधिक मामलों का अनुकूल समाधान होगा। थके हुए हैं किंतु विश्राम का समय नहीं। एक कदम और आगे बढ़ने पर रास्ता सुचारु हो जाता है। प्रलोभन में पड़ना आसान है।", "산택손": "शारीरिक ऊर्जा काफी खर्च होती है। सम्मान और मान्यता मिलती है। चीजें धीरे-धीरे छोटी-छोटी करके जमा होती हैं। बलिदान को स्वीकार करना होगा। जमा किए धन को निवेश करना होगा। प्रेम में दोनों एक-दूसरे से प्रेम करते हैं और धीरे-धीरे गहरा होता है। शेयर मुश्किल से बनाए रखे जाते हैं। एक काम से दो लाभ होते हैं। जो निवेश किया वह लाभ देगा। मानवीय संबंध मजबूत और भरोसेमंद होते हैं। अच्छी सुरक्षा मिलती है। जो भी हो वह मुश्किल से पूरा होता है। बाहरी स्थिरता और अंदर शांति बढ़ती है। उत्पादन उद्योग अच्छा चलता है। सट्टा और मनोरंजन उद्योग उचित नहीं। धन का प्रवाह छोटा और कठिन होता है। यात्रा में मजा नहीं आता। मेहनत सार्थक साबित होती है। व्यक्तिगत व्यवसाय में असफलता की संभावना अधिक है। ऊपर और नीचे के बीच सहयोग अच्छा होता है। कार्यस्थल पर एकता अपने चरम पर है। धीरे-धीरे आगे बढ़ना बेहतर है। छोटी बातें परिणाम देती हैं। सब मिलकर एक साथ काम करते हैं। मित्रों के बीच वफादारी गहरी होती है। भरोसा करके सौंपने पर सफलता मिलती है। जिम्मेदारी की भावना भाग्य को आगे ले जाती है। प्रतिनिधि बनते हैं। एक सुखद रहस्य बनता है। खर्च को अत्यधिक कम करना होगा। लगन ही सफलता दिलाती है। भरोसा करने पर लाभ; संदेह करने पर हानि।", "풍뢰익": "नींव डाली जा रही है। अभी शुरू करने पर सुचारु रूप से आगे बढ़ता है। प्रेम का आगमन होता है। अधिकार और शक्ति उत्पन्न होती है। कार्यस्थल पर विभाग प्रमुख बनते हैं। मेहनत का परिणाम दिखने लगा है। समस्याएँ पहचानी जाती हैं और सुलझाई जाती हैं। स्थिर और अटूट — कुछ टूटता नहीं। शेयर से लाभ केवल दीर्घकालिक निवेश पर। एक अप्रत्याशित प्रस्ताव आता है। अनुबंध होता है। वादे बदलने पर सौभाग्य हाथ से निकल जाता है। हमेशा पीछे देखते हुए आगे बढ़ना जरूरी है। मुनाफा निश्चित होता है।समझौता की जरूरत नहीं। एक शांत और विनम्र लाभ होता है। छोटी लड़ाईयों में जीत मिलती है। नौकरी मिलती है या मजबूत होती है। कठिन है किंतु परिणाम मिलता है। पालने-पोसने के काम अच्छी तरह होते हैं। इलाज में देरी करने पर छोटी बीमारी बड़ी हो जाती है। जो सपना देखा था वह हकीकत बनता है। कोई वरिष्ठ अच्छा मार्गदर्शन करता है। रोमांच नहीं किंतु सार्थकता है। मेहनती को आकाश भी मदद करता है। छोटी चीजें धीरे-धीरे बड़ी होती हैं। चाहे मछली हो या इंसान — आसानी से पकड़ में आता है। क्रोध जल्दी शांत करने पर खुशी आती है। दया दिखाने पर बड़ा फल मिलता है। दावा करने या कबूल करने पर स्वीकृति मिलती है। एक कदम पीछे लेने पर रास्ता बनता है।", "택천쾌": "वर्तमान स्थिति अस्थिर है। स्त्रियों के मामले में पुरुष के त्याग देने की संभावना अधिक है। न्यायोचित लड़ाई है किंतु नुकसान होने की संभावना है। ऊँचे पदों पर बैठे लोगों को हटना पड़ता है। अधीनस्थों से लड़ाई करने पर बड़ा नुकसान होता है। वरिष्ठ को हराकर पदोन्नति मिलती है। जरूरत से ज्यादा मेहनत हो रही है। बिना शल्य चिकित्सा के ठीक हो जाते हैं। शेयर तेजी से गिरते हैं। प्रतिबिंब और माफी माँगने पर नुकसान कम होता है। यात्रा स्थल पर दुर्घटना का खतरा है। कर्मचारी बहुत अधिक हैं। घमंड करने पर तुरंत दुर्घटना होती है। अंततः सब फट पड़ता है — सँभालना संभव नहीं। दुश्मन मिटने के लिए तैयार है। धीरे-धीरे करने पर भी पर्याप्त है। एक नई स्त्री मिलती है। घर के अंदर दुर्घटना होती है। कंपनी में विद्रोह की संभावना है। अपनी योग्यता का मूल्यांकन सावधानी से करना होगा। बैंक का पैसा लेने पर केवल बड़ा कर्ज बनता है। गर्भवती महिलाओं को अत्यंत सावधान रहना होगा। पुत्र का जन्म होगा किंतु समय से पहले। कठोरता के कारण बच्चा घर छोड़ देता है। व्यवहार बहुत अतिशयोक्तिपूर्ण है। ऊपर और नीचे की लड़ाई का समाधान नहीं होता। साथ मिलकर लड़ने पर जीत होती है। ऊर्जा उमड़ रही है। स्त्रियों को हर बात में सावधान रहना होगा। किसी माँ जैसी महिला को दुर्घटना का खतरा है।", "천풍구": "स्वेच्छाचारिता और आत्मकेंद्रित सोच दुर्घटनाओं को बुलाती है। एक स्त्री बुरा बर्ताव करके पुरुष को भगा देती है। अल्पकालीन जीत के बाद बड़ा नुकसान होने वाला है। अकेले जाने पर बिना शर्त असफलता। लालच अधिक है — जो खोता है वह और अधिक है। विपत्ति पनप रही है। वरिष्ठों की नाराजगी मिलती है। बिल्कुल बोलना बंद करके जीवन गुजारें। करीबी लोग मन में नापसंद करते हैं। बिना वजह मुँह मत खोलें। स्त्रियों को आत्म-संयम रखना होगा। जो पेड़ पर नहीं चढ़ सकते उसे मत देखें। अस्थायी रूप से पुरुष मिलता है किंतु जल्द भाग जाता है। स्त्री मिलती है किंतु वह अच्छी नहीं है। अपनी हैसियत और पद मत भूलें। चिढ़ दिखाने पर आपदा आती है। दूर भागकर रहना सबसे समझदारी है। हारने वाली लड़ाई छेड़ी है और बाद में पछताते हैं। शेयर पूरी तरह बर्बाद हो जाते हैं। व्यवसाय शुरू करने पर बर्बादी होती है। एक छोटी समस्या बड़ी होगी — जल्दी निपटाएँ। जिद के कारण बर्बादी हो रही है। बहुत से पुरुष आते हैं किंतु सब गायब हो जाते हैं। सिर झुकाकर मेल-मिलाप करें। मुकदमे में हार होती है। शिकायत और आरोप लगाने पर उल्टे नुकसान होते हैं। आपदा के लिए तैयार रहें। कोई बुरी संयोगात्मक घटना होती है। बहुत से अधिकारसमझौता करने होंगे। नींव ठीक से तैयार नहीं है। इधर-उधर उपद्रव करना बंद करें।", "택지췌": "अचानक और अप्रत्याशित उन्नति का भाग्य है। स्त्रियों ने पुरुष को पक्का पकड़ लिया है। अभी छोटे हैं किंतु बढ़ते जा रहे हैं। लंबे कष्टों से मुक्ति मिलती है। अपना घर-ठिकाना बनता है। नौकरी मिलती है। काम और अवसर आने लगे हैं। थोड़ी-थोड़ी बचत होने लगी है। सौभाग्य खींचा आ रहा है। नए मित्र बढ़ते हैं। पुरुषों के मामले में अभी तक स्त्री का हृदय नहीं जीता। चोरी और सामान खोने का खतरा है। शरीर में सूजन और अन्य बीमारियों से सावधान रहें। छोटा है किंतु घर-संसार को ईमानदारी से बढ़ाना होगा। अभी संतोष नहीं है किंतु एक निश्चित मौका हाथ आता है। दिखने में जितना उतना असल में नहीं है। अधीनस्थों का अच्छा नेतृत्व करने पर सौभाग्य आता है। एक बेस कैंप तैयार होगा। बाहर से सहायता आती है। गलतफहमियाँ अंत में दूर होती हैं। अनुबंध पक्का होता है। मेहनती रहने पर फल मिलेगा। थोड़े फिजूलखर्च को स्वीकार करना होगा। शेयर से बड़ा पैसा नहीं बनता। अभी प्रतिस्पर्धी ताकत कमजोर है। कार्यस्थल पर स्थिरता आ रही है। घर और बाहर दोनों जगह खुश ाला होगा। बहुत परिवर्तन आते हैं। काम अधूरे रहते हैं। मन की अवस्था बहुत बदलती रहती है। घर बदलने का अवसर है। दूसरों से झगड़े बढ़ते हैं। प्रेमी से अलगाव होगा। आगे और पीछे बार-बार होता है। कोई व्यवस्था नहीं है। थकाने वाले काम बहुत हैं। कार्यस्थल पर स्थान परिवर्तन होता है। काम करने पर भी लाभ नहीं बचता। बार-बार क्रोध आता है। व्यर्थ प्रयास बहुत हैं। फिजूलखर्ची अधिक है। दूर की यात्रा खतरनाक है। बाहर निकलना अधिक होता है। व्यस्तता के कारण बोरियत नहीं होती। शुरू तो बड़ा होता है पर अंत कमजोर। बड़ा लगता है किंतु अंदर खाली है। शल्य चिकित्सा होती है। वाहन दुर्घटना का खतरा अधिक है। जो अच्छा था वह बुरा होता है। जो बुरा था वह नए अवसर की ओर जाता है। जितना भी करें संतोष नहीं होता। बाहर और अंदर दोनों जगह लड़ाई होगी। बहुत लोगों से मुलाकात होती है। मात्रा की बजाय गुणवत्ता बढ़ाने पर ध्यान देना होगा। जहाँ तक हो काम शुरू न करना फायदेमंद है। मौजूदा स्थिति टूटती है। उधार दिया पैसा वापस नहीं आता। दूर से खबर आती है। शेयर में फर्क नहीं पड़ता। परीक्षाओं में असफलता। कूटनीति परिणाम नहीं देती। वादे टूटते हैं। निवेश पूरी तरह खो जाता है। गलतियाँ बढ़ती हैं।", "간위산": "आगे नहीं बढ़ सकते। मकान की कीमतें बढ़ती हैं। प्रेमी नहीं मिलता। स्थान स्थिर होता है। जीवन शांत और नीरस है। दूर जाने का कोई अवसर नहीं। गहरा अकेलापन आता है। दूसरों से सहायता नहीं मिलती। धन का प्रवाह नहीं होता। नया व्यवसाय असफल होता है। परीक्षाओं में असफलता। स्वास्थ्य बिगड़ता नहीं किंतु जो बीमारी है वह लंबे समय तक रहती है। आसपास से संवाद ठीक नहीं होता। रहस्य उजागर नहीं होते। कोई प्रसिद्धि या सम्मान नहीं। न लाभ न हानि। मित्रता मजबूत होती है। लड़ाई में जीत नहीं होती किंतु हार भी नहीं। सभी दुर्भाग्य अपनी जिद के कारण हैं। पदोन्नति नहीं मिलती। काम और अवसर नहीं बढ़ते। ग्राहक एकदम गायब हो जाते हैं। भारी सामान बेचने का व्यवसाय सफल होता है। घर से जितनी दूर जाएँ दुर्घटना का खतरा उतना बढ़ता है। बचत होती है। नए व्यवसाय में शुरुआत से ही समस्या आती है। अपनी राय बिल्कुल नहीं रखनी चाहिए। काम में देरी होना आम बात है। चुप रहने पर नुकसान कम होता है। दीर्घकालिक योजनाएँ सफल होती हैं। बहुत धीरे — और भी धीरे चलना होगा। घर में कोई रोगी हो तो मृत्यु की संभावना अधिक है। काम को प्रकृति पर छोड़ना होगा। परिवर्तन न होने से थकान और निराशा होती है। हर स्थिति को दीर्घकालिक नजरिए से देखकर सहन करें। सृजनात्मकता की कमी है — तरीका बदलना होगा।", "풍산점": "चीजें बमुश्किल आसान होने लगी हैं। एक अनुबंध अंततः हो जाता है। एक पुरुष और स्त्री के बीच पहली भावनात्मक संपर्क हो रही है। प्रेमी मिलता है। पुरुष-स्त्री की मित्रता प्रेम में बदल रही है। जो पूरी तरह जमा था वह पिघलने लगा है। धैर्य रखने पर काम होता है। हाथ मिला लिया है — अगला कदम आलिंगन है। अचल संपत्ति की कीमतें थोड़ी-थोड़ी बढ़ेंगी। शेयर ऊपर जाने लगते हैं। आगे बढ़ने की गति बहुत धीमी है। खेल का मैदान धीरे-धीरे चौड़ा होगा। गलतफहमियाँ दूर होती हैं। थोड़े-थोड़े लोग इकट्ठा होते हैं। धन का प्रवाह देर से होता है। व्यवसाय में जितनी देर करें उतना बेहतर। जो व्यवसाय शुरू हो चुका है वह यथास्थिति में है। पीछे हटना नहीं होता। लाभ कम है। प्रतियोगिता में पीछे रह जाते हैं। कोई बड़ा सौभाग्य नहीं आता। निवेश कम करें। यात्रा करने पर घर में परेशानी होती है। दूसरों के साथ मिलकर किए काम होते हैं। स्थिति घुटनभरी है किंतु जल्द सुधरेगी। लाभ कम हो तो भी मेहनत जरूरी है। देर से चलने पर नुकसान होता है। छोटी-छोटी बातों पर भी बहुत खुश होना चाहिए। बीमारी लंबे समय तक चलती है। पुरानी चीजें नई से बेहतर हैं। पुरानी चीज में फूल खिलेंगे। मनाने में सफलता मिलेगी। दस बार प्रयास करने पर सफलता मिलती है। दृष्टि का विस्तार करना होगा। नजरिया बदलने की जरूरत है।", "뇌택귀매": "आगे बढ़ रहे हैं किंतु धीरे-धीरे थकते जा रहे हैं। मातृभूमि या घर छोड़ना होगा। गतिविधि का मंच विस्तृत करना होगा। पुरुष किसी स्त्री का दामन नहीं छोड़ पा रहे। जो पुरुष चला गया था वह वापस आता है। काम सिकुड़ेगा। परंपरा से हटकर कुछ नया करने की जरूरत है। पीछे देखने पर नुकसान होता है। निष्क्रिय रवैया छोड़ना होगा। मोह के कारण काम बिगड़ता है। अनुभव और दृष्टिकोण का विस्तार करने का प्रयास करना होगा। बड़ी योजनाएँ मत बनाएँ। पर्याप्त तैयारी आवश्यक है। धन का प्रवाह नहीं होता। शेयर गिरते हैं। बड़े सौभाग्य की उम्मीद मत करें। साहस ही सौभाग्य को जगाता है। बच्चा बीमार पड़ेगा — अच्छी देखभाल करें। व्यापार का स्थान गलत चुना गया। अनुबंध रद्द होते हैं या लाभ कम होता है। बैठे-बैठे कमाने की सोच छोड़नी होगी। स्वास्थ्य बिगड़ रहा है। बीमारी ठीक होती दिखती है फिर वापस आ जाती है। हार मानकर जीने पर मन को दुख नहीं होता। दूर तक उड़ना संभव नहीं है। बचत खत्म होने का खतरा है। केवल असली क्षमता ही मायने रखती है। तैयार काम में ऐन मौके पर राख पड़ती है। खुशी क्रोध में बदल सकती है। कमजोरी बढ़ने पर मुसीबत बढ़ती है। अपना दिल खोलकर दिखाएँ। आपका अपना रवैया ही भाग्य को बिगाड़ रहा है।", "뇌화풍": "एक छोटी घटना बर्फ के गोले की तरह बड़ी होती जाती है। स्त्रियों के जीवन में कई पुरुष प्रकट होते हैं। चिंताएँ जमा होती जाती हैं। बंद होने का खतरा है। प्रेम बहुत अधिक शारीरिक होता जा रहा है। उत्पादन उद्योग अच्छा चलेगा। प्रतियोगिता में जीत संभव नहीं। शेयर बहुत लंबे समय रखने पर ही लाभ होता है। अनुबंध होता है। स्वास्थ्य अत्यंत खतरनाक है — कैंसर का खतरा भी है। गलती ही परेशानी की जड़ बनती है। अत्यधिक आसक्ति से भाग्य बिगड़ता है। शिकायत और बैर को जल्दी न सुलझाने पर पूरी तरह बर्बादी होती है। पैसा खर्च करना होगा — जमा मत करें। मित्रता और गहरी होती है। कुछ भी नया नहीं होता। साझेदारी सर्वोत्तम है। विचारों का मेल बड़ी आसानी से होता है। बहुत लोग इकट्ठा होते हैं। बाहर की तरफ निकलना होगा। दूर की यात्रा दुर्घटना लाएगी। बैठे रहने पर समस्याएँ होती हैं; घूमने पर थोड़ा आसान होता है। यह समय समग्र सुधार की माँग करता है। शरीर सूजता है, पाचन बिगड़ता है और भारीपन महसूस होता है। संसार को सरल नजरिए से देखना बेहतर है। अपनी चालाकी से खुद को ही नुकसान होता है। जितना लंबा खींचें उतना नुकसान। भूलने में असमर्थता ही एक बड़ी बीमारी है। समूह और संगठन बढ़ते हैं किंतु दक्षता सबसे खराब है। लचीलेपन की कमी से हल नहीं निकलता। व्यवसाय मंदी में प्रवेश करेगा। सभी इच्छाएँ समाप्त करने पर दुर्भाग्य गायब होता है। दूसरों को उदारता से देने पर दुर्भाग्य गायब होता है। खर्च करने से मत डरें। कंजूसी से बड़ी बीमारी होती है।", "화산려": "एक घुटन भरी जगह से मुक्ति मिलती है। प्रेमी से अलगाव होगा। यात्रा करनी होगी। घर से दूर रहने पर सौभाग्य बढ़ता है। विश्वासघात और अकेलापन आता है। घर बदलने पर सौभाग्य आता है। सब कुछ बदलें। रुकी हुई स्थिति से बाहर निकलते हैं। जो काम चल रहा था उसे रोकने पर सौभाग्य आता है। कुछ बिल्कुल अलग करने पर फायदा होता है। आजादी है किंतु थकान जमा होती है। स्वास्थ्य बना रहता है किंतु और सावधानी जरूरी है। बहुत गलतफहमियाँ मिलती हैं। पुराना व्यवसाय अचानक चल पड़ता है। अंत में असली क्षमता दिखाने का मौका मिलता है। बहुत विश्राम की जरूरत है। भरोसा केवल खुद पर करें। लोगों पर भरोसा करने पर निराशा होती है। हर दिशा में देखें। इच्छाएँ और लालसाएँ शांत करनी होंगी। जल्दी करने की जरूरत नहीं। हर जगह अवसर हैं। स्थिति बहुत अपरंपरागत है। कोई दोष नहीं किंतु तरीका बदलना होगा। लड़ाई करने पर कोई फायदा नहीं। शेयर पूरी तरह बर्बाद होते हैं। जीवन में एक नया बदलाव आता है। लक्ष्य छोटे करने होंगे। केवल मेहनत से ही सफलता मिलती है। इंतजार नहीं करना — पहल करनी होगी। विनम्रता से फायदा होता है। बहुत समय बर्बाद होता है। सिद्धांतों को और मजबूत करना होगा। इंसानों से संबंध का दायरा बढ़ाना होगा। तनाव छोड़कर सहजता अपनाएँ। काम करने पर बिना शर्त परिणाम मिलता है। नई दिशा में आगे बढ़ें। बिखरने के बाद फिर इकट्ठा होते हैं। फिजूलखर्ची अधिक है किंतु जरूरी है। अभी बसने की सोच मत रखें।", "손위풍": "एक नई ऊर्जा आकार ले रही है। अच्छी बातें यहाँ-वहाँ बहुत हो रही हैं। व्यस्त हैं किंतु थके नहीं। प्रसिद्धि की राह पर हैं। घर बदलना होगा। कार्यस्थल पर पद में बदलाव आता है। अनिश्चितता बहुत अधिक है। फिजूलखर्ची अधिक है। धन का प्रवाह नहीं होता किंतु गुजारा हो सकता है। लाभ अधिक नहीं है। आसपास बहुत ज्यादा लोग सलाह दे रहे हैं। शेयर पूरी तरह बर्बाद होते हैं। जो काम चल रहा था वह नए सिरे से शुरू करना पड़ता है। सामाजिक मेलजोल होता है किंतु वह अस्थायी है। आत्म-संयम न होने से खतरा है। काम और अवसर धीरे-धीरे बढ़ते हैं। बहुत से लोगों से मुलाकात होती है। अभी व्यापार शुरू करने पर ग्राहकों की भीड़ लग जाती है। भारी काम में सफलता नहीं। बड़े व्यवसाय की बजाय छोटे में सफलता। बहुत बोलने से सौभाग्य चला जाता है। अच्छा लगता है किंतु असल में कुछ नहीं। बहुत धोखा खाएंगे। चमकदार कपड़े पहनने की बजाय भारी और गंभीर वस्त्र पहनें। भटकाव होता है। बहुत मित्रों के साथ मिलने पर नए विचार आते हैं। यात्राएँ बार-बार होती हैं। दृढ़ता बहुत कमजोर है। बचत नहीं होती। आमदनी छोटी है और खर्च बढ़ते हैं। अत्यधिक सुधार से अस्थिरता आती है। मन को नहीं सँभाला तो दुर्घटना होगी। स्वास्थ्य में बार-बार छोटी-छोटी बीमारियाँ आती हैं। प्रेम टूट जाता है। व्यवहार को गंभीर और संयत बनाएँ। शांति और स्थिरता की कमी है। लोगों की बातें सच मान लेने की गलती न करें। लक्ष्य तय करते समय उन्हें सरल रखें। मन जरूरत से ज्यादा आशावादी है।", "태위택": "खुशी आएगी। चीजें एक-एक करके जमा होती जाती हैं। प्रेमी मिलेगा। स्थिरता और जड़ें जमती हैं। यात्रा करना अशुभ है। अनेक अच्छे आयोजन होते हैं। व्यवसाय निश्चित रूप से अपनी जगह बना लेता है। कार्यस्थल पर मनपसंद पद मिलता है। मुख्य भूमिका मिलती है। शेयर यथास्थिति में रहते हैं। नया घर बनेगा या मिलेगा। धन का प्रवाह अच्छा है। शांत मन सौभाग्य को बुलाता है। स्वास्थ्य की कोई चिंता नहीं। घर के सदस्यों को भी अच्छी बातें होती हैं। लड़ाई से गहरी निराशा आती है। आकाश देगा — बहुत मेहनत मत करें। छोटे-छोटे लाभ बार-बार होते हैं। स्वीकार करने की क्षमता जितनी अधिक उतना सौभाग्य बढ़ता है। लोगों का विश्वास गहरा होता है। अधिकार और गरिमा बनी रहेगी। दूसरे ईर्ष्या करेंगे। मित्र से मिलने पर काम और अच्छा सुलझता है। बड़ों का सम्मान करने पर अच्छी बातें होती हैं। साफ-सुथरा रूप बनाए रखना फायदेमंद रहेगा। व्यक्तिगत व्यवसाय सफल होता है। आवश्यक वस्तुओं के व्यवसाय में बड़ी सफलता। दूर की बजाय पास में अच्छी बातें होती हैं। आकाश जो देता है उसे दूसरों के साथ बाँटें। आज अच्छा है — बुरे दिनों के लिए तैयार रहें। दृढ़ता थोड़ी कम है। सौभाग्य लंबे समय तक बने रहने पर लापरवाही मत करें। कभी-कभी थोड़ा अलग रास्ता लेना जरूरी है। दूसरों के गुण अपनाने होंगे। पड़ोसियों से अच्छे संबंध रखने पर बड़ी मदद मिलती है। घर में शांति है और बड़े-छोटे सभी अच्छे हैं।", "풍수환": "व्यवस्था टूट रही है। आर्थिक नुकसान होता है। धन का प्रवाह नहीं होता। स्त्रियों के साथ किसी पुरुष का विश्वासघात होता है। वफादारी नहीं निभाई जा सकती। गलतियाँ हर जगह हैं। लापरवाही और स्वच्छंदता से स्थिति बिगड़ती जाती है। अनुबंध होने वाला था किंतु टूट जाता है। यह मामला गड़बड़ा गया — अगले की तैयारी करें। शरीर और मन को सँभालकर रखें। बड़ी और साहसी बात से ज्यादा छोटी और सावधान बात बेहतर है। एकता की इस समय से अधिक जरूरत कभी नहीं थी। खालीपन और अकेलापन आता है। दूसरों का मजाक उड़ाने पर पूरी तरह बर्बाद होते हैं। सावधानी की कमी से उलझनें बढ़ती जाती हैं। मित्रों के प्रति विनम्र रहें। दिखने में भरोस य सबसे खराब — मृत्यु भी संभव है। मानवीय संबंध टूट रहे हैं। आकाश को प्रसाद या पूजा अर्पित करना उचित होगा। स्वार्थी मानसिकता छोड़ने पर रास्ता खुलता है। लोगों को छोड़कर क्या पाएंगे? मकान की कीमतें लगातार गिरती हैं। घर बदलने पर थोड़ा सुधार होता है। जीतने की कोशिश मत करें — समझौता करें। अनुचित लाभ और भी अधिक नुकसान करता है।", "수화기제": "चीजें लगातार गड़बड़ाती रहती हैं। अत्यधिक पूर्णतावाद बर्बादी लाता है। बहुत डरपोक होने से सौभाग्य नहीं आता। बहुत कुछ छोड़ना होगा। याद रखें — केवल आप ही काबिल नहीं हैं। नखरे करने से प्रेम बनाए रखना मुश्किल होता है। सोच बहुत हो तो उसे दबा दें। सुनें और स्वीकार करें। मित्र सब नापसंद करते हैं। ठोस और बड़े इंसान बनें। काम अच्छा करते हैं और फिर भी बुरी बातें सुनते हैं। सार्वजनिक जिम्मेदारी लेने पर दुर्घटना होती है। बड़े काम में बिल्कुल सफलता नहीं। गलती करने पर बहाना मत बनाएँ। एक बार जो फट गया वह सँभाला नहीं जा सकता। बार-बार मन बदलने पर बड़ी मुसीबत। स्वास्थ्य में हमेशा कोई न कोई समस्या। तैयार काम बिगड़ जाता है। सौभाग्य हो तो भी लंबे समय तक नहीं टिकता। दूसरों की बात मत करें — खुद की चिंता करें। औपचारिक पोशाक से बचें; आकस्मिक पहनावा अपनाएँ। थोड़ी शराब पीना जरूरी हो सकता है। घर ठीक से चलाते दिखते हैं किंतु समस्याएँ हैं। शेखी मत मारें और दूसरों के मामलों में दखल मत दें। बड़ों की बात सुनें। कार्यस्थल पर विश्वास नहीं मिलता। काम बाँटने पर दोनों तरफ असफलता। अच्छे पहलू की उम्मीद मत करें — बुरे पहलू से सावधान रहें। निर्णय लेने की क्षमता आवश्यक है। महत्वहीन बातों में डूबे मत रहें। बड़े व्यवसाय का सपना देखना भी बंद करें।", "화수미제": "भाग्य धीरे-धीरे नियंत्रण में आ रहा है। प्रतिबिंब से तुरंत लाभ होता है। पहले पुराना साफ करना होगा तब भाग्य आएगा। नए लोगों से मिलना होगा। प्रेम में झगड़ा होता है और टूट जाता है। प्रेमी का अभी समय नहीं आया। बिचौलिए से विवाह भी इस समय अनुकूल नहीं। इंतजार करने पर सब ठीक होगा। खर्च कम करना होगा। दूसरों की गलतियाँ समझना और अपनी गलतियों की सजा स्वयं लेना बुद्धिमानी है। कष्ट ही सौभाग्य की ओर ले जाता है। जो विरोधाभासी है उसे ठीक करने पर सौभाग्य आता है। इससे बुरा और क्या होगा — मन शांत रखें। चूहे के बिल में भी धूप पड़ती है। थकें नहीं। बहुत प्रयास बर्बाद होते हैं किंतु कुछ तो बचता है। काम की शुरुआत ही गलत थी। एक-एक काम सुलझाकर आगे बढ़ें। सोच में थोड़ा बदलाव करने पर सब ठीक होगा। दूसरे जो कहें वह बिना शर्त सही है। एक बड़ी गलतफहमी है। धोखाधड़ी, चोरी और नुकसान होते हैं। आँगन में जो टपका वह रसोई में भी टपकता है। नई चीजें मत बनाएँ — जो टूटा है उसे सुधारें। अवसर बार-बार आएंगे — अंत तक ऊर्जा बनाए रखें। अजीब और व्यर्थ सोच से बहुत नुकसान होता है। बीच का रास्ता बनाए रखने की कोशिश करें। बार-बार आने वाले दुर्भाग्य को खुद की गलती मानना होगा। सिद्धांत टूटे हुए हैं। लापरवाही से काम करने की आदत छोड़नी होगी। दूसरे आपको पहचानें इसकी उम्मीद मत करें — आप दूसरों को पहचानें। सावधान और मेहनती हैं फिर भी गलतियाँ होती हैं।"};

"택화혁":"La frustración largamente suprimida finalmente erupciona. La probabilidad de cirugía es alta. Puede ocurrir un evento repentino inesperado. Persevera — y luego persevera más. No viajes bajo ninguna circunstancia. Existe riesgo de confinamiento o restricción. El capital está completamente congelado y atado. Pelear causa un incidente importante. Las acciones suben enormemente si se dejan como están. Sigue una profunda discordia familiar. El liderazgo en la organización puede cambiar. Los artículos perdidos y el dinero desaparecido se recuperan. La libertad de movimiento está gravemente limitada. Existe riesgo de incumplimiento financiero. Los problemas se han ido acumulando. Los malentendidos se dan y se reciben. Es probable que una relación romántica termine. Los asuntos están bloqueados y la frustración se acumula. Riesgo de embarazo no deseado. Una madre expectante dará a luz a una hija. El negocio está bloqueado pero se recuperará en breve. No asumas riesgos ni apuestas. Los deseos actuales son excesivos. Los subordinados pueden traicionar. Los niños causan profunda preocupación. Surgen demandas imposibles. Los secretos no se pueden guardar. Para las mujeres, incluso si aparece una pareja romántica, no dura. Mucha gente alrededor alberga malos sentimientos. Se debe cambiar una manera autoritaria. El rol debe reducirse y reducirse. La situación laboral es inestable. Mantén el corazón amplio y receptivo. El desastre es una preocupación genuina. Existen malos compañeros cerca.",
"화풍정":"La conclusión es excelente en todos los aspectos. Se recibirán felicitaciones. Se alcanza el objetivo. Ocurre algo profundamente satisfactorio. El negocio logra una ganancia sólida y sustancial. La popularidad sube. Se recibe un gran reconocimiento. No hay necesidad de pelear. El atractivo crece. El amor alcanza el destino del matrimonio. Ocurre un evento gozoso. Vender acciones trae beneficio. Aún no deben iniciarse nuevas empresas. La lotería entrega una victoria. La felicidad continúa por mucho tiempo. Se recibe un regalo de flores. La fama y el honor se elevan. Lo que estaba bloqueado se resuelve con gran claridad. Continuar el trabajo actual es cada vez mejor. Los problemas desaparecen. La enfermedad sana completamente. Victoria en la competencia basada en habilidades. Se gana dinero en el juego. Se recibe ascenso. El amor y la confianza se reciben de muchas personas. Un asunto pendiente durante mucho tiempo finalmente se contrata. Es tiempo de cosechar, no de plantar. Se devuelve el dinero prestado. Se gana un premio o se recibe una herencia. Una madre expectante da a luz a una hija. Se asume una buena posición en el lugar de trabajo. El dolor se disuelve y llega la paz. Viene un evento celebratorio. El romance alcanza el pico de la felicidad. Aparecerá una pareja romántica. Las cosas solo mejoran con el paso del tiempo. La confianza crece en todas las cosas. Se obtiene una licencia o calificación. El momento de la victoria finalmente ha llegado.",
